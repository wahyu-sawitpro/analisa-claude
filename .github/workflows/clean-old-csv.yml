name: Clean old CSV

on:
  schedule:
    - cron: "0 0 * * *"   # setiap hari jam 07:00 WIB (00:00 UTC)
  workflow_dispatch:       # bisa juga dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # butuh riwayat penuh untuk tahu umur tiap file

      - name: Delete CSV files last committed more than 7 days ago
        run: |
          cutoff=$(date -d '7 days ago' +%s)
          git ls-files -z '*.csv' | while IFS= read -r -d '' f; do
            t=$(git log -1 --format=%ct -- "$f")
            if [ "$t" -lt "$cutoff" ]; then
              git rm -q -- "$f"
              echo "Removed: $f"
            fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove CSV files older than 7 days"
            git push
          else
            echo "Nothing to remove"
          fi
